name: Build Rafiq Alqiraa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --org com.alshaheen --project-name rafiq_alqiraa --platforms=android --no-pub

      - name: Locate Android SDK manager and install API 36
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Force compile SDK 36 for app and Android plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file was not generated")
          s = app.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          s, n = re.subn(r"(compileSdk(?:Version)?\\s*[= ]\\s*)\\d+", r"\\g<1>36", s, count=1)
          if "compileSdk = 36" not in s and "compileSdkVersion 36" not in s:
              raise SystemExit("Failed to force app compileSdk 36")
          app.write_text(s)
          print("Forced app compileSdk 36 in", app)

          # Flutter plugins such as file_picker are separate Android subprojects.
          # Force their Android library compileSdk too, not only the app module.
          root = Path("android/build.gradle")
          if not root.exists():
              raise SystemExit("Expected generated android/build.gradle")
          gradle = root.read_text()
          marker = "// FORCE_ANDROID_SUBPROJECT_COMPILE_SDK_36"
          if marker not in gradle:
              gradle += "\\n\\n" + marker + """
          subprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                  }
              }
          }
          """
              root.write_text(gradle)
          print("Forced compileSdk 36 for Android plugin subprojects")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-alqiraa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
