name: Build Rafiq Alqiraa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --org com.alshaheen --project-name rafiq_alqiraa --platforms=android --no-pub

      - name: Locate Android SDK manager and install API 36
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Force compile SDK 36 for app and Android plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = app.read_text()
          source = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          source = source.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          source, count = re.subn(
              r"(compileSdk(?:Version)?\s*[= ]\s*)\d+",
              r"\g<1>36",
              source,
              count=1,
          )
          if "compileSdk = 36" not in source and "compileSdkVersion 36" not in source:
              raise SystemExit("Failed to force app compileSdk 36")
          app.write_text(source)
          print("Forced app compileSdk 36 in", app)

          # Newer Flutter templates may generate the root Gradle file as Kotlin DSL.
          root_candidates = [Path("android/build.gradle"), Path("android/build.gradle.kts")]
          root = next((p for p in root_candidates if p.exists()), None)
          if root is None:
              raise SystemExit("Generated Android root Gradle file was not found")

          marker = "// FORCE_ANDROID_SUBPROJECT_COMPILE_SDK_36"
          gradle = root.read_text()
          if marker not in gradle:
              if root.suffix == ".kts":
                  addition = '''
          // FORCE_ANDROID_SUBPROJECT_COMPILE_SDK_36
          subprojects {
              afterEvaluate { project ->
                  val androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      val compileSdkMethod = androidExtension.javaClass.methods.firstOrNull {
                          (it.name == "compileSdkVersion" || it.name == "setCompileSdkVersion") &&
                              it.parameterTypes.size == 1 &&
                              (it.parameterTypes[0] == Int::class.javaPrimitiveType ||
                               it.parameterTypes[0] == Integer::class.java)
                      }
                      compileSdkMethod?.invoke(androidExtension, 36)
                  }
              }
          }
          '''
              else:
                  addition = '''
          // FORCE_ANDROID_SUBPROJECT_COMPILE_SDK_36
          subprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      def compileSdkMethod = androidExtension.class.methods.find {
                          (it.name == "compileSdkVersion" || it.name == "setCompileSdkVersion") &&
                              it.parameterTypes.length == 1
                      }
                      compileSdkMethod?.invoke(androidExtension, 36)
                  }
              }
          }
          '''
              root.write_text(gradle.rstrip() + "\n\n" + addition.lstrip())

          print("Forced compileSdk 36 for Android plugin subprojects using", root)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-alqiraa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
